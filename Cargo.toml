[workspace]
resolver = "2"
members = ["crates/dxn_dtcg_nsh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.DtcgNsh"
homepage = "https://github.com/dXnSix/dXn.DtcgNsh"

[workspace.dependencies]
# A release tag, as dXn.Dtcg's consumers pin it: v1.4.0 has `TokenType`, the
# structure check and `dxn.dtcg.string` / `dxn.dtcg.boolean`.
dxn_dtcg = { git = "https://github.com/dXnSix/dXn.Dtcg", tag = "v1.4.0" }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
