[package]
name = "rayx_dtcg"
description = "Exports a DTCG 2025.10 design-token project as an NSH theme document (cssVars, tokens, modifiers), and checks that it is current."
keywords = ["dtcg", "design-tokens", "nsh", "theme"]
categories = ["command-line-utilities", "gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "rayx-dtcg"
path = "src/main.rs"

[dependencies]
# A dXn.Dtcg release tag: v1.4.0 has `TokenType`, the structure check and `dxn.dtcg.string` /
# `dxn.dtcg.boolean`. Declared here, not in the workspace table, so that a commit moving the tag
# changes this crate's packaged files and release-plz releases it (docs/releasing.md).
dxn_dtcg = { git = "https://github.com/dXnSix/dXn.Dtcg", tag = "v1.4.0" }
serde_json.workspace = true
